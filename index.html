<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="150x150" href="/favicon.png" />
  <title>Heroes of NVVH</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: Arial, sans-serif;
      background: #1a1a1a;
      color: #fff;
      overflow: hidden;
    }
    
    #game {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .mobile-warning {
      width: min(100% - 32px, 520px);
      text-align: center;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(0, 0, 0, 0.35);
      border-radius: 8px;
    }

    .mobile-warning h1 {
      font-family: 'Bungee', Arial, sans-serif;
      font-size: clamp(28px, 9vw, 44px);
      line-height: 1.1;
      margin-bottom: 16px;
    }

    .mobile-warning p {
      font-family: 'Chakra Petch', Arial, sans-serif;
      font-size: 18px;
      line-height: 1.4;
      color: rgba(255, 255, 255, 0.82);
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
